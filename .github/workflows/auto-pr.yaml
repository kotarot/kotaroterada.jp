name: Open pull request for agent branches

# Opens a PR to main when an AI agent pushes a `claude/**` branch.
# The PR is authored by github-actions[bot] (via GITHUB_TOKEN), so the
# repository owner can approve and merge it.
# Requires "Allow GitHub Actions to create and approve pull requests"
# in Settings > Actions > General.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Create pull request if none is open
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: ${{ github.ref_name }}
      run: |
        existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
        if [ "$existing" != "0" ]; then
          echo "An open PR already exists for $BRANCH."
          exit 0
        fi
        if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
          echo "No commits ahead of main on $BRANCH."
          exit 0
        fi
        first=$(git rev-list --reverse origin/main..HEAD | head -n 1)
        title=$(git log -1 --format=%s "$first")
        {
          git log -1 --format=%b "$first" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' || true
          echo
          echo '---'
          echo "_Opened automatically by \`.github/workflows/auto-pr.yaml\` for \`$BRANCH\`._"
        } > "$RUNNER_TEMP/pr-body.md"
        gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
